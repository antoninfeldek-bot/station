<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Station</title>
<meta name="theme-color" content="#070a24">
<style>
@font-face{font-family:'Inter Display';src:url(fonts/InterDisplay-Black.otf) format('opentype');font-weight:900;font-display:swap}
@font-face{font-family:'Inter Display';src:url(fonts/InterDisplay-Medium.otf) format('opentype');font-weight:500;font-display:swap}
:root{--accent:#ff6fd8;--accent2:#5fe0d0;--ink:#0b0a1f;--gold:#ffd166}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#070a24;color:#fff;font-family:'Inter Display',system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;left:0;right:0;pointer-events:none;padding:max(14px,env(safe-area-inset-top)) 18px 0}
.top{top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.brand{font-weight:900;font-size:clamp(18px,4.6vw,26px);letter-spacing:.5px;text-shadow:0 3px 0 var(--ink)}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.75;letter-spacing:1px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--accent2);margin-right:8px;box-shadow:0 0 12px var(--accent2);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.crewbox{text-align:right;background:rgba(11,10,31,.55);border:3px solid var(--ink);border-radius:18px;padding:8px 14px;backdrop-filter:blur(6px)}
.crewbox span{display:block;font-size:12px;letter-spacing:2px;color:var(--accent2);font-weight:900}
.crewbox small{display:block;font-size:11px;opacity:.75;margin-top:3px;font-weight:500}
.crewbox b{font-size:clamp(26px,7vw,40px);color:var(--gold);line-height:1;text-shadow:0 3px 0 var(--ink)}
.bottom{bottom:0;top:auto;padding:0 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px}
.tag{font-size:clamp(15px,3.8vw,19px);text-align:center;max-width:520px;line-height:1.3;text-shadow:0 2px 0 var(--ink)}
.tag b{color:var(--gold)}
.btn{pointer-events:auto;font:900 clamp(18px,4.6vw,22px) 'Inter Display',system-ui;color:#fff;background:var(--accent);border:4px solid var(--ink);border-radius:20px;padding:15px 26px;box-shadow:0 6px 0 var(--ink);cursor:pointer;transition:transform .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.small{pointer-events:auto;font-size:14px;color:#fff;opacity:.85;text-decoration:none;border-bottom:2px solid var(--accent2)}
.next{font-size:13px;opacity:.8}
.modal{position:fixed;inset:0;background:rgba(5,6,26,.7);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(4px)}
.modal.open{opacity:1;pointer-events:auto}
.modal:not(.open) *{pointer-events:none!important}
.box{background:#121a4a;border:4px solid var(--ink);border-radius:26px;padding:24px;width:min(420px,100%);box-shadow:0 10px 0 var(--ink);transform:translateY(20px) scale(.96);transition:transform .3s cubic-bezier(.2,1.2,.4,1)}
.modal.open .box{transform:none}
.box h2{margin:0 0 14px;font-size:26px}
input{width:100%;font:900 22px 'Inter Display',system-ui;padding:14px 16px;border-radius:16px;border:4px solid var(--ink);background:#fff;color:var(--ink);outline:none}
.list{margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto}
.list h4{margin:4px 2px 0;font-size:12px;letter-spacing:2px;opacity:.6}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:900 17px 'Inter Display',system-ui;color:#fff;background:#1d2766;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;cursor:pointer}
.res i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none;font-style:normal}
.res em{margin-left:auto;font-style:normal;color:var(--gold);font-size:14px}
.res.board{background:var(--accent);justify-content:center}
.tabs{display:flex;gap:6px;margin:0 0 10px}.tabs button{flex:1;font:900 13px 'Inter Display',system-ui;color:#fff;background:#1d2766;border:3px solid var(--ink);border-radius:12px;padding:8px 4px;cursor:pointer}
.tabs button.on{background:var(--accent)}
.arow button.gr{background:#3fae7a}.arow button.gy{background:#5a6290}
.arow{display:flex;align-items:center;gap:8px;background:#1d2766;border:3px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:15px}
.arow b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arow .src{font-size:11px;opacity:.7;white-space:nowrap}
.arow a{color:var(--accent2);font-weight:900;font-size:13px;text-decoration:none;white-space:nowrap}
.arow button{font:900 13px 'Inter Display',system-ui;border:2px solid var(--ink);border-radius:9px;padding:6px 9px;cursor:pointer;background:#ff4d6d;color:#fff}
.arow button.ok{background:#3fae7a}
.msg{font-size:14px;margin-top:10px;color:var(--gold);font-weight:500;min-height:0}
.admin{pointer-events:auto;font-size:12px;background:#000a;color:#fff;border:1px solid #fff5;border-radius:8px;padding:4px 8px}
.note{font-size:12.5px;opacity:.7;margin-top:12px;line-height:1.4;font-weight:500}
#card{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(460px,100%);background:#121a4a;border:4px solid var(--ink);border-bottom:none;border-radius:28px 28px 0 0;padding:16px 16px max(16px,env(safe-area-inset-bottom));transition:transform .45s cubic-bezier(.2,1,.3,1);max-height:92vh;overflow:auto}
#card.open{transform:translate(-50%,0)}
#cabinCanvas{width:100%;aspect-ratio:1;border-radius:20px;border:4px solid var(--ink);display:block;background:#1a1f4a}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;margin:10px 4px 6px}
#cabinNo{font-size:24px;color:var(--gold);text-shadow:0 2px 0 var(--ink)}#cabinWho{font-size:16px;opacity:.9}
.hint{font-size:12.5px;opacity:.7;margin:0 4px 8px;font-weight:500}
.opt{display:flex;align-items:center;gap:8px;margin:7px 4px;flex-wrap:wrap}.opt label{width:74px;font-size:13px;opacity:.85}
.chip{width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;font-size:18px;background:#fff;padding:0;transition:transform .15s}
.chip.on{outline:3px solid var(--gold);transform:scale(1.12)}
.cardbtns{display:flex;gap:8px;margin-top:12px}.cardbtns .btn{flex:1;font-size:16px;padding:12px 10px}
</style></head>
<body>
<canvas id="scene"></canvas>
<div style="position:fixed;left:0;right:0;bottom:0;height:40vh;background:linear-gradient(rgba(5,6,26,0),rgba(5,6,26,.9));pointer-events:none"></div>
<div style="position:fixed;left:0;right:0;top:0;height:18vh;background:linear-gradient(rgba(5,6,26,.7),rgba(5,6,26,0));pointer-events:none"></div>
<div class="hud top">
  <div class="brand"><span class="dot"></span><span id="name"></span><small id="dayLabel"></small></div>
  <div class="crewbox"><span id="crewLabel"></span><b id="crew">0</b><small id="aboard"></small></div>
</div>
<div class="hud bottom">
  <div class="tag" id="tag"></div>
  <div class="row"><button class="btn" id="find"></button></div>
  <div class="next"><span id="next"></span> <b id="nextT"></b></div>
  <a class="small" id="follow" target="_blank" rel="noopener"></a>
  <div class="row"><button class="admin" id="adminBtn" style="display:none">👮 Posádka (admin)</button><button class="admin" id="syncBtn" style="display:none"></button></div>
</div>
<div class="modal" id="modal"><div class="box">
  <h2 id="modalTitle"></h2>
  <input id="handle" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="note" id="modalNote"></div>
  <div class="msg" id="msg"></div>
  <div class="list" id="results"></div>
</div></div>
<div class="modal" id="adminModal"><div class="box" style="width:min(520px,100%)">
  <h2>👮 Posádka</h2>
  <div class="tabs"><button data-tab="new" class="on">🆕 Noví <span id="cNew"></span></button><button data-tab="ok">✅ Zkontrolovaní <span id="cOk"></span></button><button data-tab="ban">🚫 Vyhození <span id="cBan"></span></button></div>
  <input id="admQ" placeholder="hledat…" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div class="note" id="admHelp"></div>
  <div class="row" id="admTools" style="margin-top:8px;justify-content:flex-start"><button class="admin" id="admCopy">📋 Kopírovat jména</button><button class="admin" id="admAllOk">✅ Všichni noví jsou OK</button></div>
  <div class="list" id="admList"></div>
  <div class="row" style="margin-top:12px"><button class="btn alt" id="admClose">Zavřít</button></div>
</div></div>
<div id="card">
  <canvas id="cabinCanvas" width="720" height="720"></canvas>
  <div class="cardhead"><b id="cabinNo"></b><span id="cabinWho"></span></div>
  <div class="hint" id="cabinHint"></div>
  <div class="opt"><label id="suitL"></label><div id="suits" class="row" style="justify-content:flex-start"></div></div>
  <div class="opt"><label id="visorL"></label><div id="visors" class="row" style="justify-content:flex-start"></div></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="claim" style="display:none"></button></div>
  <div class="cardbtns"><button class="btn" id="dl"></button><button class="btn alt" id="share"></button></div>
  <div class="row" style="margin-top:8px"><button class="admin" id="rm" style="display:none"></button></div>
  <div class="row" style="margin-top:10px"><a class="small" id="close" href="#" onclick="return false"></a></div>
</div>
<script type="module" src="app.js"></script>
</body></html>
